name: ci
on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python -m benchmark.generate && git diff --exit-code benchmark/generated  # generated cases are up to date
      - name: Import Absher (pinned commit, not committed to this repo)
        run: python -m benchmark.importers.absher
      - run: python -m engine.benchmark
      - run: python -m pytest
      - name: End-to-end scan — demo bots + mock LLM (offline, no keys)
        env:
          COMPAT_BASE_URL: http://127.0.0.1:8000/v1
          COMPAT_MODEL: mock
          COMPAT_API_KEY: unused
          COMPAT_LABEL: Mock LLM (chance-level)
        run: python -m engine.run --targets bankbot-baseline bankbot-hardened compat --suites bank absher --sample 200
      - name: Fail if the hardened bot leaks
        run: |
          python - <<'PY'
          import json, glob
          s = json.load(open(sorted(glob.glob("results/runs/*/summary.json"))[-1]))
          h = next(t for t in s["targets"] if "hardened" in t["target"])
          assert h["leaks"] == 0, f"hardened bot leaked {h['leaks']} time(s)"
          print("hardened bot: 0 leaks")
          PY
      - run: python -m report.render
      - uses: actions/upload-artifact@v4
        with: { name: scan-results, path: results/runs/ }
